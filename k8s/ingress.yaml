apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-tours-ingress
  namespace: travel-tours
spec:
  ingressClassName: nginx
  rules:
    - host: travel-tours.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: travel-tours-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travel-tours-frontend
                port:
                  number: 80
