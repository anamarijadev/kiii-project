name: ci-cd.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-build:
    name: Backend - build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # skipnuva test
      - name: Build backend (compile & package, skip exam test-suite)
        working-directory: ./travel-tours-backend
        run: mvn -B clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: travel-tours-backend/target/*.jar
          retention-days: 5

  frontend-build:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: travel-tours-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./travel-tours-frontend
        run: npm ci

      - name: Type-check & build
        working-directory: ./travel-tours-frontend
        run: npm run build
